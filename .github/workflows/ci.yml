name: CFFI DSP Pipeline CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install GCC (MinGW) for Windows runner
      - name: Set up MinGW GCC
        uses: egor-tisin/setup-ninja@v1 # adds gcc/g++ toolchain on Windows

      - name: Run PowerShell Test Pipeline
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Unrestricted -Scope Process
          .\run_tests.ps1